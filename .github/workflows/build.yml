name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x64,   arch: x64 }
          - { name: x86,   arch: Win32 }
    steps:
      - uses: actions/checkout@v4
      - name: Configurer
        run: cmake -S . -B build -A ${{ matrix.arch }}
      - name: Compiler
        run: cmake --build build --config Release --target TwinsPlayer ac3test
      - name: Préparer l'archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/TwinsPlayer.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath TwinsPlayer-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TwinsPlayer-${{ matrix.name }}
          path: TwinsPlayer-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
